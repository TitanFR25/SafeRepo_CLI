
[package]
name = "SafeRepo_CLI"
version = "0.6.9"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
semver = "1.0"
sha2 = "0.11"
chrono = {version = "0.4", features = ["serde"] }
generic-array = "1.4.3"
clap = { version = "4.4", features = ["derive"] }
colored = "3.0.0"
log = "0.4.26"
env_logger = "0.11.6"
indicatif = "0.18.4"
thiserror = "2.0.18"
rayon = "1.7"
comfy-table = "7.1"
console = "0.16.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
ed25519-dalek = { version = "2.2.0", default-features = false }
rand_core = { version = "0.6.4", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.8", features = ["html_reports"]}
smallvec = "1.11"
parking_lot = "0.12"

[[bench]]
name = "scanner_bench"
harness = false
