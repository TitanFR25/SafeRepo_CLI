
[package]
name = "SafeRepo_CLI"
version = "0.6.5"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
semver = "1.0"
sha2 = "0.11"
chrono = {version = "0.4", features = ["serde"] }
generic-array = "1.4.3"
clap = { version = "4.4", features = ["derive"] }
colored = "3.0.0"
log = "0.4.26"
env_logger = "0.11.6"
indicatif = "0.18.4"

[dev-dependencies]
tempfile = "3.8"
